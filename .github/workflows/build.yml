name: Build and push to GHCR

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Push to main → :dev tag
            type=raw,value=dev,enable={{is_default_branch}}
            # Version tag (v1.2.3) → :v1.2.3 + :latest
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # amd64-only TEMPORARILY (2026-05-25). arm64 build kept
          # failing under QEMU after the v0.5.0-dev customize feature
          # added jsondiff + evanphx/json-patch deps. Local amd64
          # build clean; QEMU arm64 produces exit-1 from `go build`
          # with no actionable stderr accessible without admin
          # log-download rights. Stripping arm64 unblocks tester
          # soak on amd64 Unraid; re-add once the arm64 failure is
          # diagnosed (likely QEMU OOM or cache pollution).
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
